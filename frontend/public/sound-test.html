<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Test - RealChat</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        button {
            padding: 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            transition: transform 0.1s, background 0.2s;
        }
        button:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .complete { background: #2196F3; }
        .complete:hover { background: #0b7dda; }
        .message { background: #FF9800; }
        .message:hover { background: #e68900; }
        .alert { background: #f44336; }
        .alert:hover { background: #da190b; }
        .info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            color: #1976d2;
        }
    </style>
</head>
<body>
    <h1>🔊 RealChat Sound Test</h1>
    <p>Click the buttons below to test different notification sounds:</p>

    <div class="button-grid">
        <button class="complete" onclick="playComplete()">
            🎉 AI Complete
        </button>
        <button class="message" onclick="playMessage()">
            📨 New Message
        </button>
        <button class="success" onclick="playSuccess()">
            ✅ Success
        </button>
        <button class="alert" onclick="playAlert()">
            ⚠️ Alert
        </button>
    </div>

    <div class="info">
        <strong>Note:</strong> These sounds use the Web Audio API to generate tones programmatically.
        No audio files are required!
    </div>

    <script type="module">
        // Import the audio generator
        class AudioGenerator {
            constructor() {
                this.audioContext = null;
                this.enabled = true;
            }

            init() {
                if (!this.audioContext) {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playTone(frequency, duration, type = 'sine') {
                if (!this.enabled) return;

                try {
                    this.init();

                    const oscillator = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();

                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);

                    oscillator.frequency.value = frequency;
                    oscillator.type = type;

                    gainNode.gain.setValueAtTime(0, this.audioContext.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.3, this.audioContext.currentTime + 0.01);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration);

                    oscillator.start(this.audioContext.currentTime);
                    oscillator.stop(this.audioContext.currentTime + duration);
                } catch (err) {
                    console.warn('Failed to play tone:', err);
                }
            }

            playComplete() {
                this.playTone(523.25, 0.1); // C5
                setTimeout(() => this.playTone(659.25, 0.1), 100); // E5
                setTimeout(() => this.playTone(783.99, 0.15), 200); // G5
            }

            playMessage() {
                this.playTone(800, 0.08);
                setTimeout(() => this.playTone(1000, 0.08), 100);
            }

            playAlert() {
                this.playTone(400, 0.15);
                setTimeout(() => this.playTone(350, 0.15), 150);
            }

            playSuccess() {
                this.playTone(880, 0.12); // A5
            }
        }

        const audioGen = new AudioGenerator();

        window.playComplete = () => audioGen.playComplete();
        window.playMessage = () => audioGen.playMessage();
        window.playAlert = () => audioGen.playAlert();
        window.playSuccess = () => audioGen.playSuccess();
    </script>
</body>
</html>
