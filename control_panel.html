<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealChat Control Panel</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            font-size: 40px;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 700;
        }

        .status-badges {
            display: flex;
            gap: 15px;
        }

        .badge {
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge.online {
            background: #10b981;
            color: white;
        }

        .badge.offline {
            background: #ef4444;
            color: white;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .main-content {
            display: grid;
            grid-template-columns: 400px 1fr;
            min-height: 600px;
        }

        .sidebar {
            background: #f7f9fc;
            padding: 30px;
            border-right: 1px solid #e1e8ed;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #8899a6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #dc2626;
        }

        .btn-secondary {
            background: white;
            color: #1a1a1a;
            border: 2px solid #e1e8ed;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #f7f9fc;
            border-color: #667eea;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .info-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #e1e8ed;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #8899a6;
            font-size: 13px;
        }

        .info-value {
            color: #1a1a1a;
            font-weight: 600;
            font-size: 13px;
        }

        .main-panel {
            padding: 30px;
        }

        .message-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .message-input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            font-size: 15px;
        }

        .send-btn {
            padding: 14px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .send-btn:hover:not(:disabled) {
            background: #5568d3;
            transform: scale(1.05);
        }

        .logs-container {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            height: 500px;
            overflow-y: auto;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            color: #e0e0e0;
        }

        .log-entry {
            padding: 8px 0;
            border-bottom: 1px solid #333;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .log-time {
            color: #8899a6;
            margin-right: 10px;
        }

        .log-success { color: #10b981; }
        .log-error { color: #ef4444; }
        .log-info { color: #3b82f6; }
        .log-warning { color: #f59e0b; }
        .log-message { color: #a78bfa; }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .action-btn {
            padding: 12px;
            background: white;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
            font-weight: 600;
        }

        .action-btn:hover {
            border-color: #667eea;
            background: #f7f9fc;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #2a2a2a;
        }

        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <span class="logo-icon">🤖</span>
                <h1>RealChat Control Panel</h1>
            </div>
            <div class="status-badges">
                <div class="badge" id="wechat-status">
                    <span class="status-dot"></span>
                    <span>WeChat: Checking...</span>
                </div>
                <div class="badge" id="agent-status">
                    <span class="status-dot"></span>
                    <span>Agent: Checking...</span>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <div class="section">
                    <h3 class="section-title">Agent Control</h3>
                    <button class="btn btn-primary" id="start-agent" onclick="startAgent()">
                        ▶️ Start Agent
                    </button>
                    <button class="btn btn-danger" id="stop-agent" onclick="stopAgent()" disabled>
                        ⏹️ Stop Agent
                    </button>
                </div>

                <div class="section">
                    <h3 class="section-title">Target Chat</h3>
                    <div class="input-group">
                        <input type="text" class="input" id="chat-name" placeholder="Enter chat name..." value="File">
                        <small style="color: #8899a6; font-size: 11px; margin-top: 4px; display: block;">
                            💡 Use "File" to find "File Transfer"
                        </small>
                    </div>
                    <button class="btn btn-secondary" onclick="searchChat()">
                        🔍 Search Chat
                    </button>
                </div>

                <div class="section">
                    <h3 class="section-title">WeChat Window</h3>
                    <div class="info-card" id="window-info">
                        <div class="info-item">
                            <span class="info-label">Status:</span>
                            <span class="info-value">Loading...</span>
                        </div>
                    </div>
                    <button class="btn btn-secondary" onclick="refreshWindow()">
                        🔄 Refresh
                    </button>
                </div>

                <div class="section">
                    <h3 class="section-title">Quick Actions</h3>
                    <button class="btn btn-secondary" onclick="readMessages()">
                        📥 Read Messages
                    </button>
                    <button class="btn btn-secondary" onclick="clearLogs()">
                        🗑️ Clear Logs
                    </button>
                </div>
            </div>

            <div class="main-panel">
                <div class="section">
                    <h3 class="section-title">Send Message</h3>
                    <div class="message-box">
                        <input type="text" class="message-input" id="message-input" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMessage()">
                        <button class="send-btn" onclick="sendMessage()">Send 📤</button>
                    </div>
                </div>

                <div class="quick-actions">
                    <button class="action-btn" onclick="sendQuickMessage('Hello!')">👋 Hello</button>
                    <button class="action-btn" onclick="sendQuickMessage('Test message')">🧪 Test</button>
                    <button class="action-btn" onclick="sendQuickMessage('Status check')">📊 Status</button>
                </div>

                <div class="section">
                    <h3 class="section-title">Activity Log</h3>
                    <div class="logs-container" id="logs"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5001';
        let socket = null;
        let agentRunning = false;
        let wechatRunning = false;

        // Initialize
        window.onload = function() {
            addLog('Control panel loaded', 'info');
            connectSocket();
            refreshStatus();
            refreshWindow();
        };

        // Socket.IO connection
        function connectSocket() {
            socket = io(API_BASE);

            socket.on('connect', () => {
                addLog('Connected to server', 'success');
            });

            socket.on('disconnect', () => {
                addLog('Disconnected from server', 'error');
            });

            socket.on('agent_status', (data) => {
                addLog(`Agent ${data.status}`, 'info');
                agentRunning = data.status === 'started';
                updateUI();
            });

            socket.on('new_message', (data) => {
                addLog(`📨 New message in ${data.chat}: ${data.message.substring(0, 50)}...`, 'message');
            });

            socket.on('ai_response', (data) => {
                addLog(`🤖 AI: ${data.response.substring(0, 50)}...`, 'info');
            });

            socket.on('message_sent', (data) => {
                addLog(`✓ Message sent to ${data.chat}`, 'success');
            });

            socket.on('error', (data) => {
                addLog(`❌ Error: ${data.error}`, 'error');
            });
        }

        // API calls
        async function apiCall(endpoint, method = 'GET', body = null) {
            try {
                const options = {
                    method,
                    headers: { 'Content-Type': 'application/json' }
                };
                if (body) options.body = JSON.stringify(body);

                const response = await fetch(`${API_BASE}${endpoint}`, options);
                return await response.json();
            } catch (error) {
                addLog(`API Error: ${error.message}`, 'error');
                return { success: false, error: error.message };
            }
        }

        async function refreshStatus() {
            const data = await apiCall('/api/status');
            if (data) {
                agentRunning = data.agent_running;
                wechatRunning = data.wechat_running;
                updateUI();
            }
        }

        async function refreshWindow() {
            const data = await apiCall('/api/wechat/window');
            if (data.success && data.window) {
                const info = data.window;
                const cursorStatus = data.cursor_in_window ? '✓ In Window' : '✗ Outside';
                const focusStatus = data.is_focused ? '✓ Focused' : '✗ Not Focused';
                const cursorPos = data.cursor ? `(${data.cursor.x}, ${data.cursor.y})` : 'N/A';
                const windowUnder = data.window_under_cursor ?
                    `${data.window_under_cursor.process_name}` : 'Unknown';
                const windowId = data.window_under_cursor && data.window_under_cursor.window_id ?
                    `#${data.window_under_cursor.window_id}` : 'N/A';

                document.getElementById('window-info').innerHTML = `
                    <div class="info-item">
                        <span class="info-label">Title:</span>
                        <span class="info-value">${info.title || 'WeChat'}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Size:</span>
                        <span class="info-value">${info.width}x${info.height}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Active:</span>
                        <span class="info-value">${info.is_frontmost ? '✓ Yes' : '✗ No'}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Cursor Pos:</span>
                        <span class="info-value" style="font-family: monospace; font-size: 11px;">${cursorPos}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Window Under:</span>
                        <span class="info-value" style="font-weight: 600; color: ${windowUnder === 'WeChat' ? '#10b981' : '#ef4444'};">${windowUnder} ${windowId}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Cursor:</span>
                        <span class="info-value">${cursorStatus}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Focus:</span>
                        <span class="info-value" style="color: ${data.is_focused ? '#10b981' : '#ef4444'}; font-weight: 700;">${focusStatus}</span>
                    </div>
                `;
                addLog('Window info refreshed', 'info');
            }
        }

        async function startAgent() {
            // Get chat name - if it's "File", search for it first
            let chatName = document.getElementById('chat-name').value;

            // If searching for "File", find the actual chat name
            if (chatName && chatName.toLowerCase() === 'file') {
                const searchData = await apiCall(`/api/wechat/chats/search?q=File`);
                if (searchData.success && searchData.results.length > 0) {
                    chatName = searchData.results[0].name;
                    addLog(`Resolved "File" to: ${chatName}`, 'info');
                }
            }

            const body = chatName ? { chat_name: chatName } : {};
            const data = await apiCall('/api/agent/start', 'POST', body);
            if (data.success) {
                addLog(data.message, 'success');
                agentRunning = true;
                updateUI();
            }
        }

        async function stopAgent() {
            const data = await apiCall('/api/agent/stop', 'POST');
            if (data.success) {
                addLog(data.message, 'success');
                agentRunning = false;
                updateUI();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message) return;

            // Get chat name - if it's "File", search for it first
            let chatName = document.getElementById('chat-name').value || 'File';

            // If searching for "File", find the actual chat name
            if (chatName.toLowerCase() === 'file') {
                const searchData = await apiCall(`/api/wechat/chats/search?q=File`);
                if (searchData.success && searchData.results.length > 0) {
                    chatName = searchData.results[0].name;
                    addLog(`Using chat: ${chatName}`, 'info');
                }
            }

            addLog(`Sending: ${message}`, 'info');

            const data = await apiCall('/api/wechat/send', 'POST', {
                message: message,
                chat_name: chatName
            });

            if (data.success) {
                addLog('Message sent successfully', 'success');
                input.value = '';
            } else {
                addLog(`Failed to send: ${data.error}`, 'error');
            }
        }

        async function sendQuickMessage(message) {
            document.getElementById('message-input').value = message;
            await sendMessage();
        }

        async function readMessages() {
            // Get chat name - if it's "File", search for it first
            let chatName = document.getElementById('chat-name').value || 'File';

            // If searching for "File", find the actual chat name
            if (chatName.toLowerCase() === 'file') {
                const searchData = await apiCall(`/api/wechat/chats/search?q=File`);
                if (searchData.success && searchData.results.length > 0) {
                    chatName = searchData.results[0].name;
                    addLog(`Using chat: ${chatName}`, 'info');
                }
            }

            addLog(`Reading messages from ${chatName}...`, 'info');

            const data = await apiCall(`/api/wechat/read?structured=true&chat_name=${encodeURIComponent(chatName)}`);

            if (data.success && data.data) {
                addLog(`Read ${data.data.message_count} messages`, 'success');
                if (data.data.latest_message) {
                    addLog(`Latest: ${data.data.latest_message.substring(0, 100)}`, 'message');
                }
            }
        }

        async function searchChat() {
            const query = document.getElementById('chat-name').value;
            if (!query) return;

            addLog(`Searching for: ${query}`, 'info');
            const data = await apiCall(`/api/wechat/chats/search?q=${encodeURIComponent(query)}`);

            if (data.success && data.results.length > 0) {
                addLog(`Found ${data.results.length} matches`, 'success');
                data.results.forEach(chat => {
                    addLog(`  • ${chat.name}`, 'info');
                });
            } else {
                addLog('No chats found', 'warning');
            }
        }

        function updateUI() {
            // Update status badges
            const wechatBadge = document.getElementById('wechat-status');
            const agentBadge = document.getElementById('agent-status');

            wechatBadge.className = `badge ${wechatRunning ? 'online' : 'offline'}`;
            wechatBadge.querySelector('span:last-child').textContent = `WeChat: ${wechatRunning ? 'Online' : 'Offline'}`;

            agentBadge.className = `badge ${agentRunning ? 'online' : 'offline'}`;
            agentBadge.querySelector('span:last-child').textContent = `Agent: ${agentRunning ? 'Running' : 'Stopped'}`;

            // Update buttons
            document.getElementById('start-agent').disabled = agentRunning;
            document.getElementById('stop-agent').disabled = !agentRunning;
        }

        function addLog(message, type = 'info') {
            const logs = document.getElementById('logs');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.innerHTML = `<span class="log-time">${time}</span>${message}`;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
            addLog('Logs cleared', 'info');
        }

        // Auto-refresh status every 2 seconds (faster response)
        setInterval(refreshStatus, 2000);
    </script>
</body>
</html>
