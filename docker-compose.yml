version: '3.8'

services:
  # WeChat Bridge Service
  wechat-bridge:
    build: ./wechat-bridge
    container_name: realchat-wechat-bridge
    ports:
      - "8080:8080"  # WebSocket
      - "8081:8081"  # HTTP
    environment:
      - WS_PORT=8080
      - HTTP_PORT=8081
      - LOG_LEVEL=info
    volumes:
      - wechat-data:/root/.wechaty
    restart: unless-stopped
    networks:
      - realchat-network

  # Agent Orchestrator Service
  agent-orchestrator:
    build: ./agent-orchestrator
    container_name: realchat-agent-orchestrator
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - WECHAT_BRIDGE_WS=ws://wechat-bridge:8080
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-anthropic}
      # Unified AI Configuration
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.anthropic.com}
      - AI_MODEL=${AI_MODEL:-claude-3-5-sonnet-20241022}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-1024}
      # Provider-specific settings
      - ZYPHER_ENABLED=${ZYPHER_ENABLED:-false}
      - OPENCLAW_ENABLED=${OPENCLAW_ENABLED:-false}
      - OPENCLAW_ENDPOINT=${OPENCLAW_ENDPOINT}
    depends_on:
      - wechat-bridge
    restart: unless-stopped
    networks:
      - realchat-network

  # Web Application (Flask + React)
  web-app:
    build: .
    container_name: realchat-web-app
    ports:
      - "5001:5001"  # Flask backend
      - "5173:5173"  # React dev server (if in dev mode)
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - WECHAT_BRIDGE_WS=ws://wechat-bridge:8080
      - AGENT_ORCHESTRATOR_URL=http://agent-orchestrator:8082
    volumes:
      - ./frontend:/app/frontend
      - ./templates:/app/templates
      - ./static:/app/static
    depends_on:
      - wechat-bridge
      - agent-orchestrator
    restart: unless-stopped
    networks:
      - realchat-network

  # Next.js Website (optional)
  hichat-website:
    build: ./hichat-website
    container_name: realchat-website
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_API_URL=http://localhost:5001
    restart: unless-stopped
    networks:
      - realchat-network

networks:
  realchat-network:
    driver: bridge

volumes:
  wechat-data:
    driver: local
